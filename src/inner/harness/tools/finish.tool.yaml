type: tool
name: finish
description: >-
  End the session. Call this when your evaluation budget is exhausted or you
  cannot improve the best score further. The best-scoring program is submitted
  automatically.
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required: [summary]
  additionalProperties: false
