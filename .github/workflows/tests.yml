name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # the tests that need neither the task snapshot nor the NexAU runtime: the evolve loop against the fake Slurm,
      # the public API, templates, dataset recipe, LLM override contract
      - run: >
          pytest -q scripts/tests/test_pipeline.py scripts/tests/test_harnessttt_api.py scripts/tests/test_harnessttt_layout.py
          scripts/tests/test_dataset_setup.py scripts/tests/test_llm_override.py scripts/tests/test_slime_training_contract.py
