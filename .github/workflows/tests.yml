name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # the whole contract suite: the evolve loop runs against the fake Slurm with a one-task fixture snapshot; tests that
      # need the NexAU runtime or the real task snapshot skip
      - run: pytest -q scripts/tests
